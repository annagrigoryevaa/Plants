version: "3.9"

services:
  db:
    image: postgres:16
    container_name: plants-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: plants
      POSTGRES_PASSWORD: plants
      POSTGRES_DB: plants
    ports:
      - "5432:5432"
    volumes:
      - plants_pgdata:/var/lib/postgresql/data

volumes:
  plants_pgdata:
